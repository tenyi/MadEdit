[package]
name = "MadEdit"
version = "0.6.7"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/tenyi/MadEdit"

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
semver = "1"
arboard = "3"
chrono = "0.4"
dirs = "7"
eframe = "0.37.0"
# Only to turn on egui's bundled monochrome emoji fonts (about 1 MB): without them,
# 🔒 on read-only tabs and the Markdown code-block copy button draw as empty boxes.
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark", "svg", "load-images"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
# Mermaid 圖表點陣化用；版本須與 egui_extras 內部的 resvg 一致
resvg = "0.45"
encoding_rs = "0.8.42"
fermaid = "0.5.1"
fontique = "0.11.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1.11"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
spellbook = "0.4.2"
sys-locale = "0.3"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig", "yaml-load", "plist-load"] }
unicode-width = "0.2"
latex-rust = "3.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSObject", "NSString", "NSURL", "objc2-core-services"] }

[build-dependencies]
embed-resource = "3.0.6"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu"] }

